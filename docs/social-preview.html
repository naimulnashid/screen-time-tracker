<!doctype html>
<!--
  Source of docs/social-preview.png, the repository's social preview
  (GitHub: Settings > General > Social preview, which has no API). 1280x640,
  GitHub's size.

  Built from the demo screenshots, so like them it shows synthetic data only.
  Retake those first (npm run demo:shots) if the dashboard has changed.

  Render with Edge (fonts come from node_modules, so `npm ci` first):

    "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new
      --disable-gpu --hide-scrollbars --force-device-scale-factor=1
      --window-size=1280,640 --virtual-time-budget=3000
      --user-data-dir=%TEMP%\social-preview-edge
      --screenshot=%CD%\docs\social-preview.png %CD%\docs\social-preview.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screen Time Tracker</title>
<style>
  @font-face { font-family: Geist; font-weight: 400; src: url(../node_modules/geist/dist/fonts/geist-sans/Geist-Regular.woff2) format('woff2'); }
  @font-face { font-family: Geist; font-weight: 500; src: url(../node_modules/geist/dist/fonts/geist-sans/Geist-Medium.woff2) format('woff2'); }
  @font-face { font-family: Geist; font-weight: 600; src: url(../node_modules/geist/dist/fonts/geist-sans/Geist-SemiBold.woff2) format('woff2'); }
  @font-face { font-family: Geist; font-weight: 700; src: url(../node_modules/geist/dist/fonts/geist-sans/Geist-Bold.woff2) format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 400; src: url(../node_modules/geist/dist/fonts/geist-mono/GeistMono-Regular.woff2) format('woff2'); }

  /* The dashboard's own tokens (src/app/globals.css, src/lib/accent.ts). */
  :root {
    --bg: #000000;
    --border: #1e1e22;
    --border-strong: #2c2c33;
    --text: #f5f5f7;
    --text-dim: #a1a1aa;
    --text-faint: #7b7b86;
    --violet: #7c5cff;
    --violet-bright: #9b82ff;
    --green: #3ddc84;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(560px 380px at 78% 18%, rgba(124, 92, 255, 0.22), transparent 70%),
      radial-gradient(420px 300px at 96% 98%, rgba(61, 220, 132, 0.10), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: Geist, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- left: the words ---- */
  .copy { position: absolute; left: 72px; top: 76px; bottom: 50px; width: 520px; display: flex; flex-direction: column; }
  .icon { width: 84px; height: 84px; border-radius: 20px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; background: #000; }
  .icon svg { width: 58px; height: 58px; }
  h1 { margin-top: 30px; font-size: 66px; line-height: 0.98; font-weight: 700; letter-spacing: -0.035em; }
  .tagline { margin-top: 24px; font-size: 25px; line-height: 1.42; color: var(--text-dim); }
  .tagline strong { color: var(--text); font-weight: 600; }
  .chips { margin-top: 30px; display: flex; gap: 10px; }
  .chip { font-size: 17px; font-weight: 500; padding: 8px 15px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-dim); background: #0c0c0e; }
  .chip.v { color: #c5b8ff; border-color: rgba(124, 92, 255, 0.55); background: rgba(124, 92, 255, 0.12); }
  .chip.g { color: #8af0b8; border-color: rgba(61, 220, 132, 0.45); background: rgba(61, 220, 132, 0.10); }
  /* The project site. The card itself links to the repository. */
  .site { margin-top: auto; display: flex; align-items: center; gap: 10px; font-family: 'Geist Mono', monospace; font-size: 18px; color: var(--text); }
  .site svg { width: 20px; height: 20px; fill: none; stroke: var(--violet-bright); stroke-width: 1.8; }

  /* ---- right: two framed screenshots ---- */
  .frame { position: absolute; overflow: hidden; border-radius: 14px; border: 1px solid var(--border-strong); background: #000;
           box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.02), 0 30px 70px rgba(0, 0, 0, 0.7); }
  .frame img { display: block; }
  .laptop { left: 668px; top: 64px; width: 640px; height: 486px; }
  .laptop img { width: 1100px; margin: -2px 0 0 -2px; }
  .phone { left: 880px; top: 318px; width: 430px; height: 306px; border-color: rgba(61, 220, 132, 0.35); }
  .phone img { width: 760px; margin: -2px 0 0 -2px; }
</style>
</head>
<body>
<section class="copy">
  <div class="icon">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16.5" r="9.5" fill="none" stroke="#7c5cff" stroke-width="3"/>
      <path d="M16 16.5 V 10.5" stroke="#ece8ff" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M16 16.5 L 20.5 19.2" stroke="#ece8ff" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>Screen Time<br>Tracker</h1>
  <p class="tagline">Per-app screen time for a <strong>Windows PC</strong> and <strong>Android phones</strong>. Local-only, and built to survive a Windows reset.</p>
  <div class="chips">
    <span class="chip v">Windows</span>
    <span class="chip g">Android</span>
    <span class="chip">Self-hosted</span>
    <span class="chip">MIT</span>
  </div>
  <div class="site">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>screen-time-tracker-site.vercel.app
  </div>
</section>

<div class="frame laptop"><img src="screenshots/laptop-overview.png" alt=""></div>
<div class="frame phone"><img src="screenshots/tour/phone-1-overview.png" alt=""></div>
</body>
</html>
