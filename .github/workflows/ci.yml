name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    # Windows, because the project is: the collectors, the path handling and
    # the PowerShell 5.1 rules below only mean something there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run selftest
      # The deployed inbox function, run against an in-memory database.
      - run: npm run test:inbox-function

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Windows PowerShell 5.1 reads a BOM-less script as ANSI, so a UTF-8
      # em-dash becomes a string delimiter and silently changes the logic.
      # Checked in 5.1 itself, not in pwsh, which would not notice.
      - name: PowerShell and VBScript are pure ASCII and parse under 5.1
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem scripts -Recurse -Include *.ps1, *.vbs) {
            if ([IO.File]::ReadAllBytes($f.FullName) | Where-Object { $_ -gt 127 } | Select-Object -First 1) {
              Write-Host "non-ASCII: $($f.FullName)"; $bad++
            }
            if ($f.Extension -eq '.ps1') {
              $errors = $null
              [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
              if ($errors) { Write-Host "parse error: $($f.FullName): $($errors[0].Message)"; $bad++ }
            }
          }
          if ($bad) { exit 1 }

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      # A tampered gradle-wrapper.jar is a supply-chain attack on anyone who
      # builds the APK; check it against Gradle's published checksums.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The phone's session rebuilding (Reconstruct.kt) on the JVM, and
      # envelopes sealed by Sealer.kt for the next step to open.
      - name: Unit tests and the reporter APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Kotlin-sealed envelopes open with the laptop's code
        working-directory: .
        run: |
          npm ci
          npx tsx scripts/open-kotlin-envelopes.ts

  inbox-function:
    # The function runs on Deno in Supabase; type-check it there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/inbox/index.ts
